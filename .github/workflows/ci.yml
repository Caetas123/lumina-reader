name: Build and test

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            qt-host: linux
            qt-arch: linux_gcc_64
          - name: macOS
            os: macos-15-intel
            qt-host: mac
            qt-arch: clang_64
          - name: Windows
            os: windows-latest
            qt-host: windows
            qt-arch: win64_msvc2022_64

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          modules: qtshadertools
          install-deps: true
          cache: true
          set-env: true

      - name: Show tool versions
        shell: bash
        run: |
          cmake --version
          qtpaths --version

      - name: Set up MSVC
        if: matrix.name == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate whitespace
        shell: bash
        run: git diff --check

      - name: Configure (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: cmake --preset default -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Configure (Unix)
        if: matrix.name != 'Windows'
        shell: bash
        run: cmake --preset default -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build --preset default --parallel 2

      - name: Test
        shell: bash
        run: ctest --preset default --output-on-failure
