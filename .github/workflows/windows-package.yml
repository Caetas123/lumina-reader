name: Windows package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools qtpdf qtspeech qtmultimedia
          install-deps: true
          cache: true
          set-env: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install native document codecs
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "lumina-vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          & (Join-Path $vcpkgRoot "vcpkg.exe") install `
            libarchive:x64-windows `
            libwebp:x64-windows `
            libavif:x64-windows `
            jpeg-turbo:x64-windows `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg failed with exit code $LASTEXITCODE." }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build DjVuLibre engine
        shell: pwsh
        run: |
          $cmakePath = (Get-Command cmake.exe -ErrorAction Stop).Source
          $ninjaPath = (Get-Command ninja.exe -ErrorAction Stop).Source
          .\tools\build-djvulibre-windows.ps1 `
            -VcpkgRoot $env:VCPKG_ROOT `
            -OutputDirectory "$PWD\dist\windows\djvu" `
            -CMakePath $cmakePath `
            -NinjaPath $ninjaPath

      - name: Configure
        shell: pwsh
        run: |
          $nativeRoot = Join-Path $env:VCPKG_ROOT "installed\x64-windows"
          $arguments = @(
            "-S", ".",
            "-B", "build/release",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DLUMINA_REQUIRE_FULL_ENGINES=ON",
            "-DLUMINA_LIBARCHIVE_INCLUDE_DIR=$nativeRoot/include",
            "-DLUMINA_LIBARCHIVE_LIBRARY=$nativeRoot/lib/archive.lib",
            "-DLUMINA_WEBP_INCLUDE_DIR=$nativeRoot/include",
            "-DLUMINA_WEBP_LIBRARY=$nativeRoot/lib/libwebpdecoder.lib",
            "-DLUMINA_AVIF_INCLUDE_DIR=$nativeRoot/include",
            "-DLUMINA_AVIF_LIBRARY=$nativeRoot/lib/avif.lib",
            "-DLUMINA_DJVU_INCLUDE_DIR=$PWD/dist/windows/djvu/include/libdjvu",
            "-DLUMINA_DJVU_LIBRARY=$PWD/dist/windows/djvu/lib/djvulibre.lib"
          )
          cmake @arguments

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: cmake -DPROJECT_BUILD_DIR=build/release "-DRELEASE_TAG=$env:GITHUB_REF_NAME" -P cmake/verify-release-version.cmake

      - name: Build
        shell: pwsh
        run: cmake --build build/release --parallel 2

      - name: Test
        shell: pwsh
        run: |
          $nativeRoot = Join-Path $env:VCPKG_ROOT "installed\x64-windows"
          $env:PATH = "$nativeRoot\bin;$PWD\dist\windows\djvu\bin;$env:PATH"
          ctest --test-dir build/release --output-on-failure

      - name: Stage application
        shell: pwsh
        run: |
          $staging = Join-Path $PWD "dist/windows/application"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "build/release/lumina_reader.exe" $staging
          windeployqt --release --no-translations --compiler-runtime --qmldir src/ui/qml (Join-Path $staging "lumina_reader.exe")

          $nativeRoot = Join-Path $env:VCPKG_ROOT "installed\x64-windows"
          Copy-Item -Path (Join-Path $nativeRoot "bin\*.dll") -Destination $staging -Force
          Copy-Item -Path "$PWD\dist\windows\djvu\bin\*.dll" -Destination $staging -Force

          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          .\tools\stage-tesseract-windows.ps1 `
            -Destination (Join-Path $staging "ocr") `
            -SevenZipPath $sevenZip

      - name: Create installer package input
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist/windows/LuminaReader-windows-x64.zip"
          Compress-Archive -Path "dist/windows/application/*" -DestinationPath $package -CompressionLevel Optimal

      - name: Build graphical installer
        shell: pwsh
        run: .\packaging\windows\build-installer.ps1 -ApplicationPackage "$PWD\dist\windows\LuminaReader-windows-x64.zip" -OutputDirectory "dist/windows"

      - name: Rename and validate installer
        shell: pwsh
        run: |
          $source = "dist/windows/installer/LuminaReaderInstaller.exe"
          $target = "dist/windows/LuminaReader-Setup-windows-x64.exe"
          Copy-Item $source $target -Force
          if ((Get-Item $target).Length -le 0) { throw "The Windows installer is empty." }
          Get-FileHash $target -Algorithm SHA256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaReader-windows-x64-installer
          path: dist/windows/LuminaReader-Setup-windows-x64.exe
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Lumina Reader $GITHUB_REF_NAME" --generate-notes

      - name: Publish Windows installer asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/windows/LuminaReader-Setup-windows-x64.exe --repo "$GITHUB_REPOSITORY" --clobber
