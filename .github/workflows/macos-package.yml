name: macOS package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: macOS x86_64 DMG
    runs-on: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools qtpdf qtspeech qtmultimedia
          install-deps: true
          cache: true
          set-env: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cmake -DPROJECT_BUILD_DIR=build/release -DRELEASE_TAG="$GITHUB_REF_NAME" -P cmake/verify-release-version.cmake

      - name: Build
        shell: bash
        run: cmake --build build/release --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir build/release --output-on-failure

      - name: Deploy Qt and create DMG
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$PWD"
          mkdir -p dist/macos
          cmake --install build/release --prefix "$project_dir/dist/macos/stage"
          app="$project_dir/dist/macos/stage/lumina_reader.app"
          test -d "$app"
          (
            cd "$project_dir/dist/macos/stage"
            macdeployqt "lumina_reader.app" \
              -qmldir="$project_dir/src/ui/qml" \
              -dmg
          )
          dmg="$(find "$project_dir/dist/macos/stage" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "macdeployqt did not produce a DMG" >&2
            exit 1
          fi
          mv "$dmg" "$project_dir/dist/macos/LuminaReader-macos-x86_64.dmg"

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/macos/stage/lumina_reader.app
          test -s dist/macos/LuminaReader-macos-x86_64.dmg
          hdiutil imageinfo dist/macos/LuminaReader-macos-x86_64.dmg >/dev/null
          shasum -a 256 dist/macos/LuminaReader-macos-x86_64.dmg

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaReader-macos-x86_64
          path: |
            dist/macos/LuminaReader-macos-x86_64.dmg
            dist/macos/stage/lumina_reader.app
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Lumina Reader $GITHUB_REF_NAME" --generate-notes

      - name: Publish macOS DMG asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/macos/LuminaReader-macos-x86_64.dmg --repo "$GITHUB_REPOSITORY" --clobber
