name: Linux package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          install-deps: true
          cache: true
          set-env: true

      - name: Show tool versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          qmake --version

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        shell: bash
        run: cmake --build build/release --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir build/release --output-on-failure

      - name: Build AppImage
        shell: bash
        run: bash packaging/linux/build-appimage.sh "${GITHUB_REF_NAME#v}" build/release dist/linux

      - name: Validate package
        shell: bash
        run: |
          file dist/linux/LuminaReader-linux-x86_64.AppImage
          test -s dist/linux/LuminaReader-linux-x86_64.AppImage
          sha256sum dist/linux/LuminaReader-linux-x86_64.AppImage

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaReader-linux-x86_64
          path: dist/linux/LuminaReader-linux-x86_64.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/linux/LuminaReader-linux-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lumina Reader $GITHUB_REF_NAME" \
            --generate-notes
