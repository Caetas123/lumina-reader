name: Feature request
description: Propose a focused improvement to Lumina Reader.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful behavior and interaction.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and accessibility considerations
      description: Explain any local data, network, keyboard, focus, contrast, or assistive-technology impact.
